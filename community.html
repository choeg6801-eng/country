      </div>

            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px">
                <img loading="lazy" decoding="async" src="{{p.flag}}" alt="" style="width: 24px; height: 16px; border-radius: 3px; object-fit: cover">
                <a href="country.html" onClick="{{p.open}}" style="color: #E8EEFF; font-weight: 700; text-decoration: none; font-size: 15px">{{p.name}}</a>
                <span style="padding: 4px 10px; border-radius: 999px; background: #13224A; color: #7FE3FF; font-weight: 600">{{p.cat}}</span>
                <span style="{{p.whoStyle}}">{{p.who}}</span>
              </div>
              <p style="margin: 0; font-size: 15px; line-height: 1.75">{{p.text}}</p>
              <div style="display: flex; gap: 8px; align-items: center">
                <button onClick="{{p.like}}" aria-pressed="{{p.likedAria}}" style="{{p.likeStyle}}">도움돼요 {{p.count}}</button>
                <button style="height: 38px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: #8C9BC7; font: inherit; font-size: 13px">신고</button>
              </div>
            </div>
          </article>
        </template>
        <template data-if="{{more}}">

        </template>
        <template data-if="{{empty}}">
          <div style="padding: 48px; border-radius: 18px; border: 1px dashed #2A3A6E; text-align: center; color: #B4C0E4; display: flex; flex-direction: column; gap: 10px; align-items: center">
            <b style="font-size: 18px; color: #E8EEFF">아직 이 조건의 꿀팁이 없어요</b>

        </template>
      </section>

          </select>
          <span style="font-size: 13px; color: #9AA8D4">카테고리</span>

            <template data-for="{{dCats}}" data-as="k"><button type="button" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="{{k.style}}">{{k.label}}</button></template>

          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-size: 13px; color: #8C9BC7">{{draftCount}}/200</span>
            <button type="submit" style="{{submitStyle}}">등록하기</button>
          </div>
          <template data-if="{{posted}}">
            <span role="status" style="font-size: 14px; color: #7FF0B0">등록됐어요! 피드 맨 위에서 확인할 수 있어요.</span>
          </template>
        </form>

        <section style="padding: 22px; border-radius: 18px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 6px">

          <template data-for="{{ranking}}" data-as="r">
            <button class="rank" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 10px; border: 0; border-radius: 10px; background: transparent; color: #E8EEFF; font: inherit; cursor: pointer; text-align: left">
              <span style="width: 20px; font-family: 'JetBrains Mono', monospace; color: #8C9BC7">{{r.n}}</span>
              <img loading="lazy" decoding="async" src="{{r.flag}}" alt="" style="width: 26px; height: 17px; border-radius: 3px; object-fit: cover">
              <span style="flex: 1">{{r.name}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; color: #7FE3FF">{{r.count}}</span>
            </button>
          </template>
        </section>

        <section style="padding: 20px 22px; border-radius: 18px; border: 1px dashed #2A3A6E; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.6; color: #B4C0E4">
          <b style="color: #E8EEFF">커뮤니티 가이드</b>
          <span>· 직접 겪은 사실 위주로 적어 주세요</span>
          <span>· 전화번호·주소 등 개인정보는 적지 않아요</span>

          <span style="color: #8C9BC7; font-size: 13px; margin-top: 4px">'예시 제보'는 국가별 대표 꿀팁을 정리한 샘플 글이에요. 새 글은 지금 쓰는 브라우저에만 저장되고, 모두가 보는 공유 게시판은 준비 중이에요.</span>
        </section>
      </aside>
    </div>
  </main>

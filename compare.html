<html lang="ko">
<head>

<style>
body{margin:0;background:#070B1A}
a{color:#7FE3FF}a:hover{color:#C8F3FF}
.nl{color:#B4C0E4;text-decoration:none;padding:10px 4px;border-bottom:2px solid transparent}
.nl:hover{color:#FFFFFF;border-bottom-color:#2A3A6E}
.swap:hover{background:#1A2752;transform:rotate(180deg)}
.swap{transition:transform .35s, background .2s}
.bar{transition:width .5s ease}
select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #FFC857;outline-offset:2px}
tbody tr:hover{background:#0B1228}
.app{container-type:inline-size}
.mbtn,.tabbar{display:none}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;padding:6px 4px;border-radius:10px;text-decoration:none;color:#9AA8D4;font-size:12px}
.tabbar a:hover{color:#FFFFFF}
.mlink{display:block;padding:14px 12px;border-radius:10px;color:#E8EEFF;text-decoration:none;font-size:17px}
.mlink:hover{background:#13224A}
@container (max-width: 760px){
.dnav,.dextra,.hide-m{display:none!important}
.mbtn{display:inline-flex!important}
.tabbar{display:flex!important}
.wrap{padding-left:16px!important;padding-right:16px!important}
.h1x{font-size:40px!important}
.h1s{font-size:32px!important}
.h2x{font-size:27px!important}
.cpad{padding:24px!important}
.tray{bottom:86px!important}
.ctable{min-width:0!important}
.pcredit{top:10px!important;left:10px!important;right:auto!important;max-width:calc(100% - 20px)!important;font-size:11px!important;padding:5px 10px!important;opacity:.85}
.ctable thead th:first-child{display:none}
.ctable tr{display:grid;grid-template-columns:1fr 1fr}
.ctable tbody tr>th{grid-column:1/-1;padding-bottom:0!important;color:#7FE3FF!important}
.ctable th,.ctable td{padding:10px 14px!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div class="app" style="font-family: 'IBM Plex Sans KR', sans-serif; color: #E8EEFF; background: #070B1A; min-height: 100vh">
  <header style="position: sticky; top: 0; z-index: 30; border-bottom: 1px solid #141E3E; background: rgba(7,11,26,.95)">
    <div class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; gap: 20px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #E8EEFF">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7FE3FF" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><ellipse cx="12" cy="12" rx="4.2" ry="9.5"></ellipse><path d="M2.5 12h19M4 7h16M4 17h16"></path></svg>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .06em">ATLAS HUB</span>
      </a>
      <nav class="dnav" aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 22px; font-size: 15px"><a class="nl" href="index.html">홈</a><a class="nl" href="continent.html">대륙 허브</a><a class="nl" href="countries.html">국가 백과</a><a class="nl" href="country.html">국가 상세</a><a class="nl" href="compare.html" aria-current="page" style="color: #FFFFFF; border-bottom-color: #7FE3FF">국가 비교</a><a class="nl" href="community.html">로컬 꿀팁</a></nav>
      <div class="dextra" style="display: flex; gap: 10px; align-items: center">
        
      </div>
      <button class="mbtn" onClick="{{toggleMenu}}" aria-expanded="{{menuAria}}" aria-label="메뉴 열기" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2A3A6E; background: transparent; color: #E8EEFF; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
    </div>
    <template data-if="{{menuOpen}}">
      <nav aria-label="모바일 메뉴" class="wrap" style="padding: 4px 32px 16px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #141E3E"><a class="mlink" href="index.html">홈</a><a class="mlink" href="continent.html">대륙 허브</a><a class="mlink" href="countries.html">국가 백과</a><a class="mlink" href="country.html">국가 상세</a><a class="mlink" href="compare.html" aria-current="page" style="background: #13224A; color: #7FE3FF; font-weight: 600">국가 비교</a><a class="mlink" href="community.html">로컬 꿀팁</a>
      </nav>
    </template>
  </header>

  <main class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 28px 32px 96px; display: flex; flex-direction: column; gap: 26px">
    <nav aria-label="현재 위치" style="font-size: 14px; color: #8C9BC7"><a href="index.html" style="color: #B4C0E4; text-decoration: none">홈</a> &#160;/&#160; 국가 비교</nav>
    <div>
      <h1 class="h1s" style="margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -.02em">국가 비교</h1>
      <p style="margin: 10px 0 0; font-size: 16px; color: #B4C0E4">두 나라를 고르면 차이가 큰 항목부터 먼저 보여드려요.</p>
    </div>

    <!-- SELECTORS -->
    <section style="display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch">
      <div style="flex: 1 1 380px; min-width: 0; padding: 0 24px 24px; border-radius: 22px; background: #0C1E33; border: 1px solid #1E4A6A; display: flex; flex-direction: column; gap: 16px; overflow: hidden"><img loading="lazy" decoding="async" src="{{photoA}}" alt="{{A.name}} 대표 풍경 — {{A.landmark}}" style="display: block; width: calc(100% + 48px); margin: 0 -24px; height: 130px; object-fit: cover">
        <label for="sa" style="font-size: 13px; font-weight: 600; color: #7FE3FF; letter-spacing: .08em">국가 A</label>
        <select id="sa" value="{{a}}" onChange="{{onA}}" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #2A5A7A; background: #081626; color: #E8EEFF; font: inherit; font-size: 18px; font-weight: 600">
          <template data-for="{{opts}}" data-as="o"><option value="{{o.code}}">{{o.name}}</option></template>
        </select>
        <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px">
          <span style="display: flex; align-items: center; gap: 14px"><img loading="lazy" decoding="async" src="{{flagA}}" alt="{{A.name}} 국기" style="width: 60px; height: 40px; border-radius: 6px; object-fit: cover; box-shadow: 0 0 0 1px rgba(255,255,255,.2)"><span><span style="font-size: 30px; font-weight: 700">{{A.name}}</span><br><span style="font-size: 14px; color: #B4C0E4">{{A.capital}} · {{A.cont}}</span></span></span>
          <span style="font-family: 'JetBrains Mono', 'IBM Plex Sans KR', monospace; font-size: 28px; color: #7FE3FF">{{clockA}}</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
        <button class="swap" onClick="{{swap}}" aria-label="두 나라 자리 바꾸기" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #2A3A6E; background: #0E1530; color: #E8EEFF; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path></svg>
        </button>
      </div>
      <div style="flex: 1 1 380px; min-width: 0; padding: 0 24px 24px; border-radius: 22px; background: #2A200C; border: 1px solid #5A4818; display: flex; flex-direction: column; gap: 16px; overflow: hidden"><img loading="lazy" decoding="async" src="{{photoB}}" alt="{{B.name}} 대표 풍경 — {{B.landmark}}" style="display: block; width: calc(100% + 48px); margin: 0 -24px; height: 130px; object-fit: cover">
        <label for="sb" style="font-size: 13px; font-weight: 600; color: #FFC857; letter-spacing: .08em">국가 B</label>
        <select id="sb" value="{{b}}" onChange="{{onB}}" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #6A5520; background: #1E1708; color: #E8EEFF; font: inherit; font-size: 18px; font-weight: 600">
          <template data-for="{{opts}}" data-as="o"><option value="{{o.code}}">{{o.name}}</option></template>
        </select>
        <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px">
          <span style="display: flex; align-items: center; gap: 14px"><img loading="lazy" decoding="async" src="{{flagB}}" alt="{{B.name}} 국기" style="width: 60px; height: 40px; border-radius: 6px; object-fit: cover; box-shadow: 0 0 0 1px rgba(255,255,255,.2)"><span><span style="font-size: 30px; font-weight: 700">{{B.name}}</span><br><span style="font-size: 14px; color: #E6D6AE">{{B.capital}} · {{B.cont}}</span></span></span>
          <span style="font-family: 'JetBrains Mono', 'IBM Plex Sans KR', monospace; font-size: 28px; color: #FFC857">{{clockB}}</span>
        </div>
      </div>
    </section>

    <template data-if="{{same}}">
      <div style="padding: 16px 20px; border-radius: 14px; background: #2B2410; border: 1px solid #5A4A1A; color: #FFD98A">같은 나라를 골랐어요. 국가 B를 바꿔 보세요.</div>
    </template>

    <!-- INSIGHTS -->
    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px">
      <div style="padding: 22px; border-radius: 18px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #8C9BC7">시차</span>
        <span style="font-size: 26px; font-weight: 700">{{gapText}}</span>
        <span style="font-size: 14px; color: #B4C0E4; line-height: 1.6">{{A.name}} 오전 9시 = {{B.name}} {{meet}}</span>
      </div>
      <div style="padding: 22px; border-radius: 18px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #8C9BC7">전자기기 · 콘센트</span>
        <span style="{{plugStyle}}">{{plugHead}}</span>
        <span style="font-size: 14px; color: #B4C0E4; line-height: 1.6">{{A.volt}} → {{B.volt}}</span>
      </div>
      <div style="padding: 22px; border-radius: 18px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #8C9BC7">인구 규모</span>
        <span style="font-size: 26px; font-weight: 700">{{popHead}}</span>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; font-family: 'JetBrains Mono', 'IBM Plex Sans KR', monospace; font-size: 12px; color: #7FE3FF">A</span><span style="flex: 1; height: 10px; border-radius: 5px; background: #13224A"><span class="bar" style="{{barA}}"></span></span></div>
          <div style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; font-family: 'JetBrains Mono', 'IBM Plex Sans KR', monospace; font-size: 12px; color: #FFC857">B</span><span style="flex: 1; height: 10px; border-radius: 5px; background: #13224A"><span class="bar" style="{{barB}}"></span></span></div>
        </div>
      </div>
    </section>

    <!-- TABLE -->
    <section style="border-radius: 20px; background: #0E1530; border: 1px solid #1E2A52; overflow: hidden">
      <div style="padding: 18px 22px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; border-bottom: 1px solid #1E2A52">
        <h2 style="margin: 0; font-size: 19px">항목별 비교</h2>
        <button onClick="{{toggleDiff}}" aria-pressed="{{onlyDiffAria}}" style="{{diffBtn}}">{{diffLabel}}</button>
      </div>
      <div style="overflow-x: auto">
        <table class="ctable" style="width: 100%; min-width: 620px; border-collapse: collapse; font-size: 15px">
          <thead>
            <tr>
              <th scope="col" style="text-align: left; padding: 14px 22px; font-size: 13px; color: #8C9BC7; font-weight: 600; width: 22%">항목</th>
              <th scope="col" style="text-align: left; padding: 14px 22px; color: #7FE3FF"><span style="display: inline-flex; align-items: center; gap: 8px"><img loading="lazy" decoding="async" src="{{flagA}}" alt="" style="width: 24px; height: 16px; border-radius: 3px; object-fit: cover">{{A.name}}</span></th>
              <th scope="col" style="text-align: left; padding: 14px 22px; color: #FFC857"><span style="display: inline-flex; align-items: center; gap: 8px"><img loading="lazy" decoding="async" src="{{flagB}}" alt="" style="width: 24px; height: 16px; border-radius: 3px; object-fit: cover">{{B.name}}</span></th>
            </tr>
          </thead>
          <tbody>
            <template data-for="{{rows}}" data-as="r">
              <tr style="border-top: 1px solid #1A2550">
                <th scope="row" style="text-align: left; padding: 14px 22px; color: #B4C0E4; font-weight: 500; font-size: 14px">{{r.label}} <span style="{{r.dot}}"></span></th>
                <td style="padding: 14px 22px">{{r.a}}</td>
                <td style="padding: 14px 22px">{{r.b}}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <div style="padding: 12px 22px; border-top: 1px solid #1E2A52; font-size: 13px; color: #8C9BC7; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFC857"></span>노란 점 = 두 나라가 다른 항목 · 1인당 GDP·물가는 World Bank API 연동 후 표시</div>
    </section>

    <!-- FOOD & ETIQUETTE -->
    <section style="display: flex; flex-wrap: wrap; gap: 14px">
      <div style="flex: 1 1 380px; min-width: 0; padding: 24px; border-radius: 20px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 19px">대표 음식</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 13px; font-weight: 600; color: #7FE3FF">{{A.name}}</span>
            <template data-for="{{A.dishes}}" data-as="d"><span style="padding: 12px 14px; border-radius: 10px; background: #0C1E33; font-size: 15px">{{d}}</span></template>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 13px; font-weight: 600; color: #FFC857">{{B.name}}</span>
            <template data-for="{{B.dishes}}" data-as="d"><span style="padding: 12px 14px; border-radius: 10px; background: #2A200C; font-size: 15px">{{d}}</span></template>
          </div>
        </div>
      </div>
      <div style="flex: 1 1 380px; min-width: 0; padding: 24px; border-radius: 20px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 19px">{{B.name}}에서 미팅할 때</h2>
        <template data-for="{{etq}}" data-as="e">
          <div style="display: flex; gap: 12px; font-size: 15px; line-height: 1.6"><span style="font-family: 'JetBrains Mono', 'IBM Plex Sans KR', monospace; color: #FFC857">0{{e.n}}</span><span>{{e.t}}</span></div>
        </template>
        <a href="country.html" onClick="{{openB}}" style="margin-top: auto; font-size: 14px; font-weight: 600">{{B.name}} 상세 페이지 →</a>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 20px 24px; border-radius: 18px; border: 1px dashed #2A3A6E">
      <span style="color: #B4C0E4">세 나라 이상 비교는 2단계 로드맵에서 추가할 수 있어요.</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <a href="countries.html" style="display: inline-flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #2A3A6E; color: #E8EEFF; text-decoration: none">다른 나라 찾기</a>
        <button onClick="{{savePdf}}" aria-busy="{{pdfBusy}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #7FE3FF; color: #04101F; font: inherit; font-weight: 700; cursor: pointer">{{pdfLabel}}</button>
      </div>
    </div>
  </main>
  
  
  
  
  <footer id="site-footer" style="border-top: 1px solid #141E3E; margin-top: 40px"><div class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 14px; font-size: 13px; line-height: 1.7; color: #8C9BC7"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #E8EEFF; letter-spacing: .06em">ATLAS HUB · 글로벌 아틀라스</span><span style="display: flex; flex-wrap: wrap; gap: 16px"><a href="credits.html" style="color: #B4C0E4">사진 · 데이터 출처</a><a href="https://www.0404.go.kr" target="_blank" rel="noopener" style="color: #B4C0E4">외교부 해외안전여행</a><span>영사콜센터 +82-2-3210-0404</span></span></div><p style="margin: 0">정보 기준일 2026년 10월 · 비자·입국 조건과 여행경보는 수시로 바뀌어요. 이 사이트의 정보는 참고용이며, 출국 전 외교부 해외안전여행과 해당국 대사관에서 반드시 최신 정보를 확인하세요. 항공권 가격·환율·날씨·뉴스는 예시 또는 근사치예요.</p><p style="margin: 0">국가 사진: Wikimedia Commons(CC 라이선스, 사진마다 작가 표기) · 일부 AI 생성 이미지(표기됨) · 국기: 단순화한 SVG · 폰트: Google Fonts</p></div></footer>
  <nav class="tabbar" aria-label="하단 메뉴" style="position: sticky; bottom: 0; z-index: 30; justify-content: space-around; padding: 8px 6px 14px; background: rgba(10,16,36,.97); border-top: 1px solid #1E2A52"><a href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"></path></svg>홈</a><a href="continent.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>대륙</a><a href="countries.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7"></rect><rect x="13" y="4" width="7" height="7"></rect><rect x="4" y="13" width="7" height="7"></rect><rect x="13" y="13" width="7" height="7"></rect></svg>국가</a><a href="compare.html" aria-current="page" style="color: #7FE3FF; background: #13224A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path></svg>비교</a><a href="community.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9h8M8 12h5"></path></svg>꿀팁</a></nav>
</div>

      <div style="display: flex; gap: 8px">

(function () { var q = new URLSearchParams(location.search); function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } var c = q.get('code'), t = q.get('tab'), n = q.get('cont'), a = q.get('a'), b = q.get('b'); if (c && window.ATLAS_DB[c.toUpperCase()]) put('atlas.code', c.toUpperCase()); if (t) put('atlas.tab', t.toLowerCase()); if (n) put('atlas.cont', n.toUpperCase()); if (a && b && window.ATLAS_DB[a.toUpperCase()] && window.ATLAS_DB[b.toUpperCase()]) put('atlas.cmp', [a.toUpperCase(), b.toUpperCase()]); })();
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { q: '', cont: '전체', sort: 'name', noTip: false, sameTime: false, plug: false, pick: ['KR', 'VN'], now: Date.now() };
  }
  componentDidMount() { var s = this; this.t = setInterval(function () { s.setState({ now: Date.now() }); }, 30000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    var DB = this.__DB || (this.__DB = window.ATLAS_DB);
    var FL = {}; Object.keys(DB).forEach(function (k) { FL[k] = DB[k].flag; });
    function __nav(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    var self = this, st = this.state;
    var C = Object.keys(DB).map(function (k) { var d = DB[k]; return { code: k, name: d.name, capital: d.capital, cont: d.cont, lang: d.lang, off: d.off, pop: d.pop, tip: !d.tipFree, plug: d.plugOk, col: d.col, bg: d.bg, photo: d.photo, landmark: d.landmark, tr: d.tr }; });
    function diff(o) { var d = o - 9; return d === 0 ? '한국과 같음' : (d < 0 ? (-d) + '시간 늦음' : d + '시간 빠름'); }
    function clock(o) { var d = new Date(st.now + o * 3600000); var h = d.getUTCHours(), m = d.getUTCMinutes(); return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
    var q = st.q.trim().toLowerCase();
    var base = C.filter(function (c) {
      if (q && (c.name + c.capital + c.code).toLowerCase().indexOf(q) < 0) return false;
      if (st.noTip && c.tip) return false;
      if (st.sameTime && Math.abs(c.off - 9) > 2) return false;
      if (st.plug && !c.plug) return false;
      return true;
    });
    var list = base.filter(function (c) { return st.cont === '전체' || c.cont === st.cont; });
    if (st.sort === 'name') list.sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });

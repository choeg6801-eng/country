<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국가 상세 · ATLAS HUB</title>
<meta name="description" content="지구본에서 나라를 고르면 비자·항공권·예산·명소·축제·에티켓·경제·뉴스까지 한 번에. 98개국 여행·문화·무역 정보 허브.">
<meta property="og:type" content="website">
<meta property="og:title" content="국가 상세 · ATLAS HUB">
<meta property="og:description" content="지구본에서 나라를 고르면 비자·항공권·예산·명소·축제·에티켓·경제·뉴스까지 한 번에. 98개국 여행·문화·무역 정보 허브.">
<meta property="og:image" content="etc/og-image.jpg">
<meta name="theme-color" content="#070B1A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B1A}
a{color:#7FE3FF}a:hover{color:#C8F3FF}
.nl{color:#B4C0E4;text-decoration:none;padding:10px 4px;border-bottom:2px solid transparent}
.nl:hover{color:#FFFFFF;border-bottom-color:#2A3A6E}
.tab:hover{color:#FFFFFF}
.lift{transition:transform .2s, border-color .2s}
.lift:hover{transform:translateY(-3px);border-color:#3D5AA8}
.hero-img{transition:transform 8s ease}
.hero:hover .hero-img{transform:scale(1.05)}
.ghost:hover{border-color:#7FE3FF;color:#FFFFFF}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #FFC857;outline-offset:2px}
textarea::placeholder{color:#7F8DBB}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.ping{animation:ping 1.6s ease-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.live{animation:blink 1.4s infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s ease both}
.app{container-type:inline-size}
.mbtn,.tabbar{display:none}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;padding:6px 4px;border-radius:10px;text-decoration:none;color:#9AA8D4;font-size:12px}
.tabbar a:hover{color:#FFFFFF}
.mlink{display:block;padding:14px 12px;border-radius:10px;color:#E8EEFF;text-decoration:none;font-size:17px}
.mlink:hover{background:#13224A}
@container (max-width: 760px){
.dnav,.dextra,.hide-m{display:none!important}
.mbtn{display:inline-flex!important}
.tabbar{display:flex!important}
.wrap{padding-left:16px!important;padding-right:16px!important}
.h1x{font-size:40px!important}
.h1s{font-size:32px!important}
.h2x{font-size:27px!important}
.cpad{padding:24px!important}
.tray{bottom:86px!important}
.ctable{min-width:0!important}
.pcredit{top:10px!important;left:10px!important;right:auto!important;max-width:calc(100% - 20px)!important;font-size:11px!important;padding:5px 10px!important;opacity:.85}
.ctable thead th:first-child{display:none}
.ctable tr{display:grid;grid-template-columns:1fr 1fr}
.ctable tbody tr>th{grid-column:1/-1;padding-bottom:0!important;color:#7FE3FF!important}
.ctable th,.ctable td{padding:10px 14px!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div class="app" style="font-family: 'IBM Plex Sans KR', sans-serif; color: #E8EEFF; background: #070B1A; min-height: 100vh">
  <header style="position: sticky; top: 0; z-index: 30; border-bottom: 1px solid #141E3E; background: rgba(7,11,26,.95)">
    <div class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; gap: 20px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #E8EEFF">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7FE3FF" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><ellipse cx="12" cy="12" rx="4.2" ry="9.5"></ellipse><path d="M2.5 12h19M4 7h16M4 17h16"></path></svg>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .06em">ATLAS HUB</span>
      </a>
      <nav class="dnav" aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 22px; font-size: 15px"><a class="nl" href="index.html">홈</a><a class="nl" href="continent.html">대륙 허브</a><a class="nl" href="countries.html" aria-current="page" style="color: #FFFFFF; border-bottom-color: #7FE3FF">국가 백과</a><a class="nl" href="country.html">국가 상세</a><a class="nl" href="compare.html">국가 비교</a><a class="nl" href="community.html">로컬 꿀팁</a></nav>
      <div class="dextra" style="display: flex; gap: 10px; align-items: center">
        
      </div>
      <button class="mbtn" onClick="{{toggleMenu}}" aria-expanded="{{menuAria}}" aria-label="메뉴 열기" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2A3A6E; background: transparent; color: #E8EEFF; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
    </div>
    <template data-if="{{menuOpen}}">
      <nav aria-label="모바일 메뉴" class="wrap" style="padding: 4px 32px 16px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #141E3E"><a class="mlink" href="index.html">홈</a><a class="mlink" href="continent.html">대륙 허브</a><a class="mlink" href="countries.html" aria-current="page" style="background: #13224A; color: #7FE3FF; font-weight: 600">국가 백과</a><a class="mlink" href="country.html">국가 상세</a><a class="mlink" href="compare.html">국가 비교</a><a class="mlink" href="community.html">로컬 꿀팁</a>
      </nav>
    </template>
  </header>

  <main class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 24px 32px 96px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center">
      <nav aria-label="현재 위치" style="font-size: 14px; color: #8C9BC7"><a href="index.html" style="color: #B4C0E4; text-decoration: none">홈</a> &#160;/&#160; <a href="continent.html" style="color: #B4C0E4; text-decoration: none">{{c.cont}}</a> &#160;/&#160; <span style="color: #E8EEFF">{{c.name}}</span></nav>
      <div style="display: flex; gap: 8px; align-items: center">
        <button class="ghost" onClick="{{prev}}" aria-label="이전 나라" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2A3A6E; background: transparent; color: #B4C0E4; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <label for="pick" style="position: absolute; left: -9999px">나라 선택</label>
        <select id="pick" value="{{code}}" onChange="{{onPick}}" style="height: 44px; min-width: 210px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0E1530; color: #E8EEFF; font: inherit; font-size: 15px">
          <template data-for="{{opts}}" data-as="o"><option value="{{o.code}}">{{o.label}}</option></template>
        </select>
        <button class="ghost" onClick="{{next}}" aria-label="다음 나라" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2A3A6E; background: transparent; color: #B4C0E4; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
    </div>

    <!-- HERO -->
    <section class="hero" style="position: relative; border-radius: 26px; overflow: hidden; border: 1px solid #1E2A52; min-height: 420px; display: flex; align-items: flex-end; background: #0E1530">
      <img loading="lazy" decoding="async" class="hero-img" src="{{c.photo}}" alt="{{c.name}} 대표 풍경 — {{c.landmark}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
      <span class="pcredit" title="{{c.landmark}} · {{c.credit}}" style="position: absolute; top: 18px; right: 18px; max-width: calc(100% - 36px); box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 7px 12px; border-radius: 999px; background: rgba(7,11,26,.72); font-size: 13px; color: #E8EEFF">{{c.landmark}} · {{c.credit}}</span>
      <div style="position: relative; width: 100%; padding: 30px 32px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between; background: linear-gradient(180deg, rgba(7,11,26,0), rgba(7,11,26,.94) 58%)">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="display: flex; align-items: center; gap: 12px"><img loading="lazy" decoding="async" src="{{c.flag}}" alt="{{c.name}} 국기" style="width: 66px; height: 44px; border-radius: 7px; object-fit: cover; box-shadow: 0 0 0 1px rgba(255,255,255,.25), 0 8px 20px rgba(0,0,0,.45)"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 5px 10px; border-radius: 8px; background: rgba(14,21,48,.85); color: #C9D3F2">{{code}} · {{c.cont}}</span></span>
          <h1 class="h1x" style="margin: 0; font-size: 58px; font-weight: 700; letter-spacing: -.02em; line-height: 1.08">{{c.name}}</h1>
          <span style="font-size: 16px; color: #D5DDF5">{{c.local}} · 수도 {{c.capital}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-end">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; justify-content: flex-end">
            <span style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: rgba(14,21,48,.88); border: 1px solid #2A3A6E"><span class="live" style="width: 7px; height: 7px; border-radius: 50%; background: #FFC857"></span>현지 {{clock}}</span>
            <span style="padding: 10px 14px; border-radius: 10px; background: rgba(14,21,48,.88); border: 1px solid #2A3A6E">{{c.capital}} {{temp}}°C</span>
            <span style="padding: 10px 14px; border-radius: 10px; background: rgba(14,21,48,.88); border: 1px solid #2A3A6E">1 {{c.curCode}} ≈ {{fx}}</span>
            <span style="{{alertChipStyle}}">{{alertChip}}</span>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end">
            <button onClick="{{toggleSave}}" aria-pressed="{{savedAria}}" style="{{saveStyle}}">{{saveLabel}}</button>
            <a href="compare.html" onClick="{{toCompare}}" style="display: inline-flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 12px; background: #FFC857; color: #1A1300; text-decoration: none; font-weight: 700">한국과 비교하기</a>
          </div>
        </div>
      </div>
    </section>

    <!-- KEY FACTS -->
    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px">
      <div style="padding: 18px; border-radius: 16px; background: #0E1530; border: 1px solid #1E2A52; display: flex; gap: 14px; align-items: center">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #13224A; display: inline-flex; align-items: center; justify-content: center; color: #7FE3FF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
        <span><span style="font-size: 13px; color: #8C9BC7">시차</span><br><b style="font-size: 17px">{{diff}}</b></span>
      </div>
      <div style="padding: 18px; border-radius: 16px; background: #0E1530; border: 1px solid #1E2A52; display: flex; gap: 14px; align-items: center">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #13224A; display: inline-flex; align-items: center; justify-content: center; color: #7FE3FF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="3"></rect><path d="M10 9v3M14 9v3M10 16h4"></path></svg></span>
        <span><span style="font-size: 13px; color: #8C9BC7">한국 플러그 · {{c.volt}}</span><br><b style="{{plugStyle}}">{{plugText}}</b></span>
      </div>
      <div style="padding: 18px; border-radius: 16px; background: #0E1530; border: 1px solid #1E2A52; display: flex; gap: 14px; align-items: center">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #3A1A1A; display: inline-flex; align-items: center; justify-content: center; color: #FF9B8A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></span>
        <span><span style="font-size: 13px; color: #8C9BC7">긴급 전화</span><br><b style="font-size: 15px">{{c.emergency}}</b></span>
      </div>
      <div style="padding: 18px; border-radius: 16px; background: #0E1530; border: 1px solid #1E2A52; display: flex; gap: 14px; align-items: center">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #13224A; display: inline-flex; align-items: center; justify-content: center; color: #7FE3FF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg></span>
        <span><span style="font-size: 13px; color: #8C9BC7">팁 문화</span><br><b style="font-size: 17px">{{c.tip}}</b></span>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <div style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <div role="tablist" aria-label="국가 정보 탭" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-radius: 14px; background: #0B1228; border: 1px solid #1E2A52">
          <template data-for="{{tabs}}" data-as="t">
            <button class="tab" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </template>
        </div>

        <!-- OVERVIEW -->
        <template data-if="{{is.overview}}">
          <div class="rise" style="display: flex; flex-direction: column; gap: 18px">
            <p style="margin: 0; font-size: 18px; line-height: 1.85; color: #C9D3F2">{{c.intro}}</p>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px">
              <template data-for="{{facts}}" data-as="f">
                <div style="padding: 16px 18px; border-radius: 14px; background: #0E1530; border: 1px solid #1E2A52"><div style="font-size: 13px; color: #8C9BC7">{{f.k}}</div><div style="font-size: 16px; font-weight: 600; margin-top: 6px; line-height: 1.5">{{f.v}}</div></div>
              </template>
            </div>
            <section style="display: flex; flex-direction: column; gap: 12px">
              <h2 style="margin: 0; font-size: 19px">주요 도시</h2>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
                <template data-for="{{c.cities}}" data-as="ct">
                  <div style="padding: 18px; border-radius: 14px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 6px"><b style="font-size: 17px">{{ct.n}}</b><span style="font-size: 14px; line-height: 1.6; color: #B4C0E4">{{ct.d}}</span></div>
                </template>
              </div>
            </section>
            <section style="padding: 20px 22px; border-radius: 16px; background: #0C1E33; border: 1px solid #1E4A6A; display: flex; flex-wrap: wrap; gap: 18px 36px">
              <span><span style="font-size: 13px; color: #7FE3FF">대표 국제공항</span><br><b style="font-size: 16px">{{c.airport}}</b></span>
              <span><span style="font-size: 13px; color: #7FE3FF">인천 출발 비행시간</span><br><b style="font-size: 16px">{{flight}}</b></span>
              <span><span style="font-size: 13px; color: #7FE3FF">통행 방향</span><br><b style="font-size: 16px">{{c.drive}}</b></span>
            </section>
            <div style="display: flex; flex-wrap: wrap; gap: 14px">
              <div style="flex: 1 1 260px; padding: 24px; border-radius: 18px; background: #13224A; border: 1px solid #2A3A6E; display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 13px; color: #9AA8D4">현지 인사말</span>
                <span style="font-size: 34px; font-weight: 700; color: #FFFFFF">{{c.hello}}</span>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #7FE3FF">[{{c.helloRead}}]</span>
              </div>
              <div style="flex: 2 1 380px; border-radius: 18px; overflow: hidden; border: 1px solid #1E2A52; background: #0A0F22; position: relative">
                <img loading="lazy" decoding="async" src="etc/e9e9cfd44284df4b9fb975bf5e3caa37.png" alt="{{c.name}} 위치가 표시된 세계 지도" style="width: 100%; display: block">
                <span style="{{pinStyle}}"><span class="ping" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #FFC857"></span></span>
                <span style="{{pinLabel}}">{{c.capital}}</span>
              </div>
            </div>
          </div>
        </template>

        <!-- CULTURE -->

        <!-- TRAVEL GUIDE -->
        <template data-if="{{is.travel}}">
          <div class="rise" style="display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 16px 20px; border-radius: 16px; background: #0C1E33; border: 1px solid #1E4A6A">
              <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px">{{c.name}} 여행 가이드</b><span style="font-size: 13px; color: #9AA8D4">비자 · 예산 · 명소 · 일정 · 교통 · 매너를 한 파일로</span></span>
              <button onClick="{{savePdf}}" aria-busy="{{pdfBusy}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #7FE3FF; color: #04101F; font: inherit; font-weight: 700; cursor: pointer">{{pdfLabel}}</button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
              <div style="padding: 20px; border-radius: 16px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #8C9BC7">비자 · 입국 (한국 여권)</span><b style="font-size: 16px; line-height: 1.5">{{tr.visa}}</b><span style="{{visaBadgeStyle}}">{{visaBadge}}</span><span style="font-size: 12px; color: #8C9BC7">{{visaMeta}}</span></div>
              <div style="padding: 20px; border-radius: 16px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #8C9BC7">추천 여행 기간 · 적기</span><b style="font-size: 16px; line-height: 1.5">{{tr.stay}} · {{c.best}}</b></div>
              <div style="padding: 20px; border-radius: 16px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #8C9BC7">외교부 여행경보 · 치안</span><b style="{{alertStyle}}">{{alertText}}</b><span style="font-size: 14px; color: #B4C0E4; line-height: 1.5">{{tr.safetyNote}}</span><span style="font-size: 12px; color: #8C9BC7">{{alertMeta}}</span></div>
              <div style="padding: 20px; border-radius: 16px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #8C9BC7">수돗물 · 전압</span><b style="font-size: 16px; line-height: 1.5">{{tr.water}}</b><span style="font-size: 14px; color: #B4C0E4">{{c.volt}} · {{c.plug}}형</span></div>
            </div>

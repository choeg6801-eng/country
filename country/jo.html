              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 8px">
                <template data-for="{{ld.stats}}" data-as="x"><div style="padding: 12px 14px; border-radius: 12px; background: #0A1024"><div style="font-size: 12px; color: #8C9BC7">{{x.k}}</div><div style="{{x.style}}">{{x.v}}</div></div></template>
              </div>
              <div style="{{ld.otherStyle}}"><span style="font-size: 13px; color: #8C9BC7">다른 나라 카드</span><template data-for="{{ld.others}}" data-as="o"><button onClick="{{o.go}}" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 13px; cursor: pointer">{{o.label}}</button></template></div>

              <h4 style="margin: 4px 0 0; font-size: 16px">잠재 바이어 · 대리점</h4>
              <form onSubmit="{{ld.addBuyer}}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 10px; padding: 14px; border-radius: 12px; background: #0A1024; border: 1px dashed #2A3A6E">
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7">회사명 *<input value="{{ld.f.name}}" onInput="{{ld.on.name}}" maxlength="60" placeholder="예: ABC Trading" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></label>
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7">유형<select value="{{ld.f.type}}" onChange="{{ld.on.type}}" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"><option>바이어</option><option>대리점</option><option>수입상</option><option>유통 · 도매</option><option>기타</option></select></label>
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7">도시<input value="{{ld.f.city}}" onInput="{{ld.on.city}}" maxlength="40" placeholder="{{c.capital}}" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></label>
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7">진행 단계<select value="{{ld.f.stage}}" onChange="{{ld.on.stage}}" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"><option>발굴</option><option>첫 연락</option><option>회신</option><option>미팅</option><option>견적 · 샘플</option><option>계약</option></select></label>
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7">다음 할 일<input value="{{ld.f.next}}" onInput="{{ld.on.next}}" maxlength="80" placeholder="예: 카탈로그 메일 발송" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></label>
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7">기한<input type="date" value="{{ld.f.due}}" onInput="{{ld.on.due}}" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></label>
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7; grid-column: 1 / -1">메모<input value="{{ld.f.memo}}" onInput="{{ld.on.memo}}" maxlength="200" placeholder="관심 품목, 담당자 직함, 미팅에서 들은 내용 등" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></label>
                <div style="grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><button type="submit" style="{{ld.addStyle}}">바이어 추가</button><span role="status" style="{{ld.msgStyle}}">{{ld.msg}}</span></div>
              </form>
              <div style="{{ld.emptyStyle}}">아직 등록한 바이어가 없어요. 아래 바로가기에서 후보를 찾아 추가해 보세요.</div>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 10px">
                <template data-for="{{ld.buyers}}" data-as="b">
                  <article style="padding: 14px 16px; border-radius: 12px; background: #0A1024; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 8px">
                    <div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><b style="font-size: 16px">{{b.name}}</b><span style="{{b.stageStyle}}">{{b.stage}}</span></div>
                    <span style="font-size: 13px; color: #8C9BC7">{{b.sub}}</span>
                    <div style="display: flex; gap: 4px"><template data-for="{{b.dots}}" data-as="d"><span style="{{d}}"></span></template></div>
                    <div style="{{b.nextStyle}}">{{b.nextText}}</div>
                    <p style="{{b.memoStyle}}">{{b.memo}}</p>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap"><button onClick="{{b.advance}}" style="{{b.advStyle}}">{{b.advLabel}}</button><button onClick="{{b.del}}" style="{{b.delStyle}}">{{b.delLabel}}</button></div>
                  </article>
                </template>
              </div>

              <h4 style="margin: 8px 0 0; font-size: 16px">경쟁사 정보</h4>
              <form onSubmit="{{ld.addComp}}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 10px; padding: 14px; border-radius: 12px; background: #0A1024; border: 1px dashed #2A3A6E">
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7">경쟁사 *<input value="{{ld.f.cname}}" onInput="{{ld.on.cname}}" maxlength="60" placeholder="회사 또는 브랜드" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></label>
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7">국적<input value="{{ld.f.cfrom}}" onInput="{{ld.on.cfrom}}" maxlength="30" placeholder="예: 중국, 독일, 현지" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></label>
                <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #8C9BC7; grid-column: span 2">강점 · 가격 · 유통 메모<input value="{{ld.f.cnote}}" onInput="{{ld.on.cnote}}" maxlength="200" placeholder="예: 단가 10% 낮음, 현지 대리점 3곳, FTA로 관세 0%" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></label>
                <div style="grid-column: 1 / -1"><button type="submit" style="{{ld.addCStyle}}">경쟁사 추가</button></div>
              </form>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <template data-for="{{ld.comps}}" data-as="k">
                  <div style="display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: #0A1024; border: 1px solid #1E2A52"><div style="display: flex; flex-direction: column; gap: 3px"><b style="font-size: 15px">{{k.name}} <span style="font-weight: 400; font-size: 13px; color: #8C9BC7">{{k.from}}</span></b><span style="font-size: 14px; line-height: 1.55; color: #B4C0E4">{{k.note}}</span></div><button onClick="{{k.del}}" style="{{k.delStyle}}">{{k.delLabel}}</button></div>
                </template>
              </div>

              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 8px">
                <template data-for="{{ld.links}}" data-as="l">
                  <a href="{{l.url}}" target="_blank" rel="noopener" style="padding: 12px 14px; border-radius: 12px; background: #0C1E33; border: 1px solid #1E4A6A; text-decoration: none; color: #E8EEFF"><b style="font-size: 14px">{{l.t}} ↗</b><div style="font-size: 12px; color: #8C9BC7; margin-top: 3px">{{l.d}}</div></a>
                </template>
              </div>
              <span style="font-size: 12px; color: #7F8DBB">카드는 이 브라우저에만 저장되고 다른 사람에게 공개되지 않아요. 브라우저 기록을 지우면 사라지니 "엑셀(CSV) 저장"으로 백업하세요. 출장 준비는 위 체크리스트와 연결돼요.</span>
            </section>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px">
              <template data-for="{{bizLinks}}" data-as="l">
                <a href="{{l.url}}" target="_blank" rel="noopener" style="padding: 16px 18px; border-radius: 14px; background: #0C1E33; border: 1px solid #1E4A6A; text-decoration: none; color: #E8EEFF"><b style="font-size: 15px">{{l.t}} ↗</b><div style="font-size: 13px; color: #8C9BC7; margin-top: 4px">{{l.d}}</div></a>
              </template>
            </div>
          </div>
        </template>
        <template data-if="{{is.tips}}">
          <div class="rise" style="display: flex; flex-direction: column; gap: 14px">
            <form onSubmit="{{submit}}" style="padding: 20px; border-radius: 18px; background: #0E1530; border: 1px solid #2A3A6E; display: flex; flex-direction: column; gap: 12px">
              <b style="font-size: 17px">{{c.name}} 꿀팁 남기기</b>
              <div style="display: flex; flex-wrap: wrap; gap: 6px">
                <template data-for="{{cats}}" data-as="k"><button type="button" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="{{k.style}}">{{k.label}}</button></template>
              </div>
              <label for="tipText" style="position: absolute; left: -9999px">꿀팁 내용</label>
              <textarea id="tipText" value="{{draft}}" onChange="{{onDraft}}" rows="3" placeholder="직접 겪은 현지 정보를 알려 주세요. 예: 공항에서 시내까지 가는 가장 쉬운 방법" style="width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px; resize: vertical"></textarea>
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8C9BC7">별명<input value="{{nick}}" onInput="{{onNick}}" maxlength="20" placeholder="여행자" aria-label="별명" style="width: 120px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A6E; background: #0A1024; color: #E8EEFF; font: inherit; font-size: 15px"></label>
                <span style="font-size: 13px; color: #8C9BC7">{{draftCount}}/200자 · 링크·연락처·개인정보는 올릴 수 없어요</span>
                <button type="submit" aria-busy="{{postBusy}}" style="{{submitStyle}}">{{submitLabel}}</button>
              </div>
              <span role="status" style="{{postMsgStyle}}">{{postMsg}}</span>
              <span style="font-size: 12px; color: #7F8DBB">{{boardNote}}</span>
            </form>
            <template data-for="{{tips}}" data-as="t">
              <article class="rise" style="padding: 18px 20px; border-radius: 16px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px">
                  <span style="padding: 4px 10px; border-radius: 999px; background: #13224A; color: #7FE3FF; font-weight: 600">{{t.cat}}</span>
                  <span style="color: #8C9BC7">{{t.who}}</span>
                </div>
                <p style="margin: 0; font-size: 15px; line-height: 1.7">{{t.text}}</p>
                <div style="display: flex; gap: 8px; flex-wrap: wrap"><button onClick="{{t.like}}" aria-pressed="{{t.likedAria}}" style="{{t.likeStyle}}">도움돼요 {{t.count}}</button><button onClick="{{t.report}}" style="{{t.reportStyle}}">{{t.reportLabel}}</button></div>
              </article>
            </template>
            <a href="community.html" style="align-self: flex-start; font-weight: 600">전체 로컬 꿀팁 게시판 →</a>
          </div>
        </template>

        <!-- NEWS -->
        <template data-if="{{is.news}}">
          <div class="rise" style="display: flex; flex-direction: column; gap: 16px">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px">
              <div style="padding: 16px 18px; border-radius: 14px; background: #2B2410; border: 1px solid #5A4A1A"><div style="font-size: 12px; color: #FFD98A; font-weight: 600">외교부 여행경보</div><div style="font-size: 15px; margin-top: 6px; color: #F2E6C6">{{alertText}}</div><div style="font-size: 12px; margin-top: 4px; color: #D9C9A0">{{alertMeta}} · 지역별 단계는 0404.go.kr에서 확인하세요</div></div>
              <div style="padding: 16px 18px; border-radius: 14px; background: #2A1414; border: 1px solid #5A2626"><div style="font-size: 12px; color: #FFB4B4; font-weight: 600">현지 긴급 전화</div><div style="font-size: 15px; margin-top: 6px; color: #F5DCDC">{{c.emergency}}</div></div>
              <div style="padding: 16px 18px; border-radius: 14px; background: #0C1E33; border: 1px solid #1E4A6A"><div style="font-size: 12px; color: #7FE3FF; font-weight: 600">현지 시각 · 날씨</div><div style="font-size: 15px; margin-top: 6px">{{clock}} · {{c.capital}} {{tempLabel}} {{temp}}°C</div><div style="font-size: 12px; margin-top: 4px; color: #9AA8D4">{{tempRange}} · 최근 10년 평년값</div></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 19px">{{c.name}} 최신 뉴스 바로가기</h2><span style="font-size: 14px; color: #8C9BC7">분야를 누르면 구글 뉴스에서 지금 올라온 실제 기사를 한국어로 검색해 보여줘요. (새 창)</span></div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px">
              <template data-for="{{newsLinks}}" data-as="n">
                <section style="{{n.cardStyle}}">
                  <div style="display: flex; align-items: center; gap: 10px"><span style="{{n.badge}}">{{n.short}}</span><b style="font-size: 16px">{{n.name}}</b></div>
                  <span style="font-size: 13px; color: #8C9BC7">{{n.hint}}</span>
                  <div style="display: flex; flex-wrap: wrap; gap: 8px">
                    <a href="{{n.url}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 10px; background: #13224A; color: #E8EEFF; text-decoration: none; font-size: 14px">최신 기사 보기 ↗</a>
                    <a href="{{n.urlKr}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px dashed #3D5AA8; color: #B4C0E4; text-decoration: none; font-size: 14px">한국 관련만 ↗</a>
                  </div>
                </section>
              </template>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 10px">
              <a href="https://www.0404.go.kr" target="_blank" rel="noopener" style="padding: 16px 18px; border-radius: 14px; background: #0E1530; border: 1px solid #1E2A52; text-decoration: none; color: #E8EEFF"><b style="font-size: 15px">외교부 해외안전여행 ↗</b><div style="font-size: 13px; color: #8C9BC7; margin-top: 4px">국가별 안전공지 · 여행경보 지역 지도</div></a>
              <a href="https://dream.kotra.or.kr" target="_blank" rel="noopener" style="padding: 16px 18px; border-radius: 14px; background: #0E1530; border: 1px solid #1E2A52; text-decoration: none; color: #E8EEFF"><b style="font-size: 15px">KOTRA 해외시장뉴스 ↗</b><div style="font-size: 13px; color: #8C9BC7; margin-top: 4px">무역관이 쓰는 시장 동향 · 수출 정보</div></a>
              <a href="{{newsGov}}" target="_blank" rel="noopener" style="padding: 16px 18px; border-radius: 14px; background: #0E1530; border: 1px solid #1E2A52; text-decoration: none; color: #E8EEFF"><b style="font-size: 15px">주재국 대사관 소식 ↗</b><div style="font-size: 13px; color: #8C9BC7; margin-top: 4px">현지 공관 공지를 구글에서 검색</div></a>
            </div>
          </div>
        </template>
      </div>

      <!-- SIDE -->
      <aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <section style="padding: 22px; border-radius: 18px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 17px">여행 · 출장 체크리스트</h2>
          <template data-for="{{checks}}" data-as="k">
            <button onClick="{{k.flip}}" aria-pressed="{{k.on}}" style="{{k.style}}"><span style="{{k.box}}">{{k.mark}}</span><span style="text-align: left">{{k.t}}</span></button>
          </template>
          <span style="font-size: 13px; color: #8C9BC7">{{checkDone}}</span>
        </section>
        <section style="padding: 22px; border-radius: 18px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 17px">이 나라와 비교해 볼까요?</h2>
          <a href="compare.html" onClick="{{toCompare}}" style="display: flex; justify-content: space-between; align-items: center; padding: 14px; border-radius: 12px; background: #1A2752; color: #E8EEFF; text-decoration: none"><span>{{c.name}} vs 대한민국</span><span style="color: #FFC857">→</span></a>
          <a href="compare.html" onClick="{{toCompareOther}}" style="display: flex; justify-content: space-between; align-items: center; padding: 14px; border-radius: 12px; background: #1A2752; color: #E8EEFF; text-decoration: none"><span>다른 나라 골라 비교</span><span style="color: #FFC857">→</span></a>
        </section>
      </aside>
    </div>

    <!-- SIMILAR -->
    <section style="display: flex; flex-direction: column; gap: 14px; margin-top: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px">
        <h2 class="h2x" style="margin: 0; font-size: 28px; font-weight: 700">{{c.cont}}의 다른 나라</h2>
        <a href="continent.html" style="font-weight: 600; font-size: 15px">대륙 허브 →</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 14px">
        <template data-for="{{similar}}" data-as="s">
          <button class="lift" onClick="{{s.go}}" style="padding: 0; border-radius: 18px; background: #0E1530; border: 1px solid #1E2A52; overflow: hidden; color: #E8EEFF; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column">
            <img loading="lazy" decoding="async" src="{{s.photo}}" alt="{{s.name}} 대표 풍경" style="width: 100%; height: 120px; object-fit: cover; display: block">
            <span style="padding: 14px 16px; display: flex; align-items: center; gap: 10px"><img loading="lazy" decoding="async" src="{{s.flag}}" alt="" style="width: 28px; height: 19px; border-radius: 3px; object-fit: cover"><b style="font-size: 16px">{{s.name}}</b><span style="margin-left: auto; font-size: 13px; color: #9AA8D4">{{s.capital}}</span></span>
          </button>
        </template>
      </div>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLAS HUB · 글로벌 아틀라스 — 나라별 여행·문화·무역 정보</title>
<meta name="description" content="지구본에서 나라를 고르면 비자·항공권·예산·명소·축제·에티켓·경제·뉴스까지 한 번에. 98개국 여행·문화·무역 정보 허브.">
<meta property="og:type" content="website">
<meta property="og:title" content="ATLAS HUB · 글로벌 아틀라스 — 나라별 여행·문화·무역 정보">
<meta property="og:description" content="지구본에서 나라를 고르면 비자·항공권·예산·명소·축제·에티켓·경제·뉴스까지 한 번에. 98개국 여행·문화·무역 정보 허브.">
<meta property="og:image" content="etc/og-image.jpg">
<meta name="theme-color" content="#070B1A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B1A}
a{color:#7FE3FF}a:hover{color:#C8F3FF}
.nl{color:#B4C0E4;text-decoration:none;padding:10px 4px;border-bottom:2px solid transparent}
.nl:hover{color:#FFFFFF;border-bottom-color:#2A3A6E}
.chip{transition:.15s}
.chip:hover{border-color:#7FE3FF;color:#FFFFFF;background:#13224A}
.lift{transition:transform .2s, border-color .2s, background .2s}
.lift:hover{border-color:#7FE3FF;transform:translateY(-4px);background:#121C3E}
.sug:hover{background:#1A2752}
.fl{transition:transform .15s, border-color .15s}
.fl:hover{transform:translateY(-2px);border-color:#7FE3FF}
.btnp:hover{background:#B5F0FF}
.btng:hover{background:#FFD98A}
.cat{transition:border-color .2s, transform .2s}
.cat:hover{border-color:#7FE3FF;transform:translateY(-3px)}
input::placeholder{color:#7F8DBB}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #FFC857;outline-offset:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.live{animation:blink 1.4s infinite}
.tick{animation:ticker 48s linear infinite}
.rise{animation:rise .35s ease both}
.app{container-type:inline-size}
.mbtn,.tabbar{display:none}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;padding:6px 4px;border-radius:10px;text-decoration:none;color:#9AA8D4;font-size:12px}
.tabbar a:hover{color:#FFFFFF}
.mlink{display:block;padding:14px 12px;border-radius:10px;color:#E8EEFF;text-decoration:none;font-size:17px}
.mlink:hover{background:#13224A}
@container (max-width: 760px){
.dnav,.dextra,.hide-m{display:none!important}
.mbtn{display:inline-flex!important}
.tabbar{display:flex!important}
.wrap{padding-left:16px!important;padding-right:16px!important}
.h1x{font-size:40px!important}
.h1s{font-size:32px!important}
.h2x{font-size:27px!important}
.cpad{padding:24px!important}
.tray{bottom:86px!important}
.ctable{min-width:0!important}
.pcredit{top:10px!important;left:10px!important;right:auto!important;max-width:calc(100% - 20px)!important;font-size:11px!important;padding:5px 10px!important;opacity:.85}
.ctable thead th:first-child{display:none}
.ctable tr{display:grid;grid-template-columns:1fr 1fr}
.ctable tbody tr>th{grid-column:1/-1;padding-bottom:0!important;color:#7FE3FF!important}
.ctable th,.ctable td{padding:10px 14px!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div class="app" style="font-family: 'IBM Plex Sans KR', sans-serif; color: #E8EEFF; background: #070B1A; min-height: 100vh; overflow-x: hidden">
  <header style="position: sticky; top: 0; z-index: 30; border-bottom: 1px solid #141E3E; background: rgba(7,11,26,.95)">
    <div class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; gap: 20px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #E8EEFF">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7FE3FF" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><ellipse cx="12" cy="12" rx="4.2" ry="9.5"></ellipse><path d="M2.5 12h19M4 7h16M4 17h16"></path></svg>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .06em">ATLAS HUB</span>
      </a>
      <nav class="dnav" aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 22px; font-size: 15px"><a class="nl" href="index.html" aria-current="page" style="color: #FFFFFF; border-bottom-color: #7FE3FF">홈</a><a class="nl" href="continent.html">대륙 허브</a><a class="nl" href="countries.html">국가 백과</a><a class="nl" href="country.html">국가 상세</a><a class="nl" href="compare.html">국가 비교</a><a class="nl" href="community.html">로컬 꿀팁</a></nav>
      <div class="dextra" style="display: flex; gap: 10px; align-items: center">
        <a class="btnp" href="countries.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 10px; background: #7FE3FF; color: #04101F; text-decoration: none; font-weight: 700; font-size: 14px">탐색 시작</a>
      </div>
      <button class="mbtn" onClick="{{toggleMenu}}" aria-expanded="{{menuAria}}" aria-label="메뉴 열기" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2A3A6E; background: transparent; color: #E8EEFF; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
    </div>
    <template data-if="{{menuOpen}}">
      <nav aria-label="모바일 메뉴" class="wrap" style="padding: 4px 32px 16px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #141E3E"><a class="mlink" href="index.html" aria-current="page" style="background: #13224A; color: #7FE3FF; font-weight: 600">홈</a><a class="mlink" href="continent.html">대륙 허브</a><a class="mlink" href="countries.html">국가 백과</a><a class="mlink" href="country.html">국가 상세</a><a class="mlink" href="compare.html">국가 비교</a><a class="mlink" href="community.html">로컬 꿀팁</a>
      </nav>
    </template>
  </header>

  <!-- HERO -->
  <section class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 56px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
    <div style="flex: 1 1 500px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
      <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid #2A3A6E; border-radius: 999px; font-size: 13px; color: #B4C0E4">
        <span class="live" style="width: 8px; height: 8px; border-radius: 50%; background: #FFC857"></span>
        {{countryCount}}개국 상세 정보 · 6개 대륙 · 공공 데이터 연동
      </div>
      <h1 class="h1x" style="margin: 0; font-size: 60px; line-height: 1.14; font-weight: 700; letter-spacing: -.02em">세계를,<br>한 번의 회전으로<br><span style="color: #7FE3FF">펼쳐보다.</span></h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.75; color: #B4C0E4; max-width: 540px">나라를 고르면 지구본이 그곳으로 돌아가요. 기본 정보부터 에티켓·음식·경제·로컬 꿀팁·뉴스까지 한 나라에 9가지 카테고리를 담았어요.</p>

      <div style="position: relative; max-width: 580px">
        <form onSubmit="{{onSubmit}}" style="display: flex; gap: 8px; padding: 8px; border-radius: 16px; background: #0E1530; border: 1px solid #2A3A6E">
          <label for="q" style="position: absolute; left: -9999px">국가 검색</label>
          <div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7F8DBB" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input id="q" value="{{q}}" onChange="{{onQ}}" autocomplete="off" placeholder="예: 스페인, 도쿄, 쌀국수, 에펠탑" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #E8EEFF; font: inherit; font-size: 16px; height: 44px">
          </div>
          <button type="submit" class="btng" style="height: 48px; padding: 0 22px; border: 0; border-radius: 10px; background: #FFC857; color: #1A1300; font: inherit; font-weight: 700; cursor: pointer">지구본에서 보기</button>
        </form>
        <template data-if="{{showSug}}">
          <div style="position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 6; padding: 8px; border-radius: 14px; background: #0E1530; border: 1px solid #2A3A6E; box-shadow: 0 18px 40px rgba(0,0,0,.5); display: flex; flex-direction: column">
            <template data-for="{{sug}}" data-as="s">
              <button class="sug" onClick="{{s.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 0; border-radius: 10px; background: transparent; color: #E8EEFF; font: inherit; text-align: left; cursor: pointer">
                <img loading="lazy" decoding="async" src="{{s.flag}}" alt="" style="width: 30px; height: 20px; border-radius: 3px; object-fit: cover; flex: none">
                <span style="flex: 1"><b>{{s.name}}</b> <span style="color: #9AA8D4; font-size: 14px">· {{s.capital}} · {{s.cont}}</span><br><span style="color: #7F8DBB; font-size: 12px">{{s.why}}</span></span>
                <span style="font-size: 13px; color: #7FE3FF">지구본에서 보기</span>
              </button>
            </template>
            <template data-if="{{noSug}}">
              <div style="padding: 14px; color: #9AA8D4; font-size: 14px">일치하는 나라가 없어요. <a href="countries.html">전체 국가 보기</a></div>
            </template>
          </div>
        </template>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #8C9BC7">지구본에서 바로 보기</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <template data-for="{{quick}}" data-as="k">
            <button class="fl" onClick="{{k.pick}}" aria-pressed="{{k.on}}" title="{{k.name}}" style="{{k.style}}"><img loading="lazy" decoding="async" src="{{k.flag}}" alt="" style="width: 24px; height: 16px; border-radius: 3px; object-fit: cover">{{k.name}}</button>
          </template>
          <button class="chip" onClick="{{random}}" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px dashed #3D5AA8; background: transparent; color: #FFD98A; font: inherit; font-size: 14px; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>랜덤 나라
          </button>
        </div>
      </div>
    </div>

    <!-- GLOBE -->
    <div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="position: relative; width: 100%; max-width: 540px">
        <canvas ref="{{globeRef}}" width="1000" height="1000" onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}" role="img" aria-label="{{globeLabel}}" style="display: block; width: 100%; aspect-ratio: 1; cursor: grab; touch-action: none"></canvas>
        <span style="position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%); font-size: 12px; color: #7F8DBB; white-space: nowrap">드래그해서 돌려 보세요 · 노란 점 = 정보가 있는 나라</span>
      </div>
      <!-- selected country card -->
      <div class="rise" style="width: 100%; max-width: 540px; border-radius: 18px; overflow: hidden; background: #0E1530; border: 1px solid #2A3A6E; display: flex; flex-wrap: wrap">
        <img loading="lazy" decoding="async" src="{{sel.photo}}" alt="{{sel.name}} 대표 풍경" style="flex: 1 1 170px; min-height: 150px; max-height: 210px; width: 100%; object-fit: cover">
        <div style="flex: 2 1 260px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px">
            <img loading="lazy" decoding="async" src="{{sel.flag}}" alt="{{sel.name}} 국기" style="width: 34px; height: 23px; border-radius: 4px; object-fit: cover; box-shadow: 0 0 0 1px rgba(255,255,255,.2)">
            <b style="font-size: 21px">{{sel.name}}</b>
            <span style="font-size: 13px; color: #9AA8D4">{{sel.cont}}</span>
          </div>
          <div style="display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px">
            <span style="color: #8C9BC7">수도</span><span>{{sel.capital}}</span>
            <span style="color: #8C9BC7">시차</span><span>{{selDiff}}</span>
            <span style="color: #8C9BC7">인사말</span><span>{{sel.hello}} <span style="color: #7FE3FF">[{{sel.helloRead}}]</span></span>
            <span style="color: #8C9BC7">한국 플러그</span><span style="{{plugStyle}}">{{plugText}}</span>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px">
            <a class="btnp" href="country.html" onClick="{{openSel}}" style="display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 10px; background: #7FE3FF; color: #04101F; text-decoration: none; font-weight: 700; font-size: 14px">상세 페이지 열기</a>
            <a href="compare.html" onClick="{{cmpSel}}" style="display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid #2A3A6E; color: #E8EEFF; text-decoration: none; font-size: 14px">한국과 비교</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- TICKER -->
  <div style="border-top: 1px solid #141E3E; border-bottom: 1px solid #141E3E; background: #0A1024; overflow: hidden; white-space: nowrap; font-size: 14px">
    <div class="tick" style="display: inline-flex; gap: 48px; padding: 16px 0; color: #B4C0E4">
      <template data-for="{{tickerItems}}" data-as="t"><span>{{t.k}} <b style="{{t.style}}">{{t.v}}</b></span></template>
    </div>
  </div>

  <!-- WHAT YOU GET -->
  <section class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 88px 32px 24px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
      <div style="max-width: 640px">
        <div style="font-family: 'JetBrains Mono', 'IBM Plex Sans KR', monospace; font-size: 13px; color: #7FE3FF; letter-spacing: .12em; margin-bottom: 12px">ONE COUNTRY, NINE CATEGORIES</div>
        <h2 class="h2x" style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -.01em">{{sel.name}} 한 나라에만 이만큼</h2>
        <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: #B4C0E4">출장 전 체크, 여행 준비, 시장 조사까지. 지금 고른 나라의 실제 데이터로 미리 보여드려요.</p>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <div style="padding: 14px 18px; border-radius: 14px; background: #0E1530; border: 1px solid #1E2A52; min-width: 110px"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; color: #7FE3FF">{{countryCount}}</div><div style="font-size: 13px; color: #9AA8D4">수록 국가</div></div>
        <div style="padding: 14px 18px; border-radius: 14px; background: #0E1530; border: 1px solid #1E2A52; min-width: 110px"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; color: #FFC857">9</div><div style="font-size: 13px; color: #9AA8D4">정보 카테고리</div></div>
        <div style="padding: 14px 18px; border-radius: 14px; background: #0E1530; border: 1px solid #1E2A52; min-width: 110px"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; color: #7FF0B0">{{itemCount}}+</div><div style="font-size: 13px; color: #9AA8D4">{{sel.name}} 정보 항목</div></div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px">
      <template data-for="{{cats}}" data-as="c">
        <a class="cat" href="country.html" onClick="{{c.open}}" style="text-decoration: none; color: #E8EEFF; padding: 22px; border-radius: 18px; background: #0E1530; border: 1px solid #1E2A52; display: flex; flex-direction: column; gap: 12px">
          <span style="display: flex; justify-content: space-between; align-items: center">
            <span style="{{c.iconStyle}}">{{c.no}}</span>
            <span style="font-size: 12px; color: #9AA8D4">{{c.count}}</span>
          </span>
          <b style="font-size: 18px">{{c.title}}</b>
          <span style="font-size: 14px; line-height: 1.6; color: #B4C0E4">{{c.sample}}</span>
          <span style="margin-top: auto; font-size: 13px; font-weight: 600; color: #7FE3FF">{{c.cta}} →</span>
        </a>
      </template>
    </div>
  </section>

  <!-- POPULAR -->
  <section class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 72px 32px 24px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 26px">
      <div>
        <div style="font-family: 'JetBrains Mono', 'IBM Plex Sans KR', monospace; font-size: 13px; color: #7FE3FF; letter-spacing: .12em; margin-bottom: 12px">POPULAR</div>
        <h2 class="h2x" style="margin: 0; font-size: 38px; font-weight: 700">많이 찾는 나라</h2>
      </div>
      <a href="countries.html" style="font-size: 15px; font-weight: 600">{{countryCount}}개국 전체 보기 →</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px">
      <template data-for="{{popular}}" data-as="c">
        <a class="lift" href="country.html" onClick="{{c.open}}" style="text-decoration: none; color: #E8EEFF; border-radius: 20px; background: #0E1530; border: 1px solid #1E2A52; overflow: hidden; display: flex; flex-direction: column">
          <img loading="lazy" decoding="async" src="{{c.photo}}" alt="{{c.name}} 대표 풍경 — {{c.landmark}}" style="width: 100%; height: 150px; object-fit: cover; display: block">
          <span style="padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
            <span style="display: flex; align-items: center; gap: 8px"><img loading="lazy" decoding="async" src="{{c.flag}}" alt="" style="width: 26px; height: 17px; border-radius: 3px; object-fit: cover"><b style="font-size: 18px">{{c.name}}</b></span>
            <span style="font-size: 13px; color: #B4C0E4">{{c.capital}} · {{c.diff}}</span>
          </span>
        </a>
      </template>
    </div>
  </section>

  <!-- FESTIVAL CALENDAR -->
  <section class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 72px 32px 24px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px">
      <div>
        <div style="font-family: 'JetBrains Mono', 'IBM Plex Sans KR', monospace; font-size: 13px; color: #FFC857; letter-spacing: .12em; margin-bottom: 12px">FESTIVAL CALENDAR</div>
        <h2 class="h2x" style="margin: 0; font-size: 38px; font-weight: 700">{{evTitle}}</h2>
        <p style="margin: 10px 0 0; color: #B4C0E4; font-size: 15px">{{evSub}}</p>
      </div>
    </div>
    <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px">
      <template data-for="{{evMonths}}" data-as="m"><button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.label}}</button></template>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px">
      <template data-for="{{evList}}" data-as="e">
